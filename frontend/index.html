<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>GMS Console</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%232746c7'/><path d='M8 13v6M24 13v6M11 10v12M21 10v12M11 16h10' stroke='white' stroke-width='2.5' stroke-linecap='round'/></svg>" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="js/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <nav class="sidebar" aria-label="Main" hidden>
        <a class="brand" href="#/">GMS Console</a>
        <label class="field location-picker">
          <span>Location</span>
          <select id="location"></select>
        </label>
        <ul class="nav">
          <li><a href="#/">Overview</a></li>
          <li><a href="#/members">Members</a></li>
          <li><a href="#/plans">Plans</a></li>
          <li><a href="#/classes">Classes</a></li>
          <li><a href="#/staff">Staff</a></li>
          <li><a href="#/reports">Reports</a></li>
        </ul>
        <div class="whoami">
          <span id="user-name"></span>
          <span id="user-role" class="muted"></span>
          <button class="ghost small" id="sign-out">Sign out</button>
        </div>
      </nav>

      <main id="main" tabindex="-1"></main>

      <aside class="inspector" id="inspector" aria-label="Network calls"></aside>
    </div>
    <button class="inspector-toggle" id="inspector-toggle" aria-controls="inspector" aria-expanded="false">Network</button>
  </body>
</html>
